<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Roleplay Bank | Profile</title>

<link rel="stylesheet" href="style.css">

<link rel="stylesheet" href="dashboard.css">

</head>


<body>


<div class="dashboard-layout">



<div class="sidebar">


<h2>
Roleplay Bank
</h2>



<a href="member-dashboard.html">

Dashboard

</a>



<a href="marketplace.html">

Marketplace

</a>



<a href="auction.html">

Auctions

</a>



<a href="profile.html">

Profile

</a>



<a href="index.html" onclick="logout()">

Logout

</a>



</div>







<div class="dashboard-content">



<h1>

My Profile

</h1>





<div class="card" id="profile">


Loading profile...


</div>







<div class="card">


<h2>

Currency Wallet

</h2>


<div id="wallet">


Loading...


</div>


</div>






</div>



</div>







<script src="api.js"></script>




<script>


const user =

JSON.parse(

localStorage.getItem(

"currentUser"

)

);





if(!user){


window.location.href =
"index.html";


}







async function loadProfile(){



const result =

await getProfile(

user.userId

);



if(!result.success){



document.getElementById(

"profile"

).innerHTML =

"Unable to load profile.";


return;


}





const profile = result.data;





document.getElementById(

"profile"

).innerHTML = `



<h2>

${profile.roleplayName}

</h2>



<p>

Username:

${profile.username}

</p>



<p>

Role:

${profile.role}

</p>



<p>

Kingdom / Empire:

${profile.kingdom || "Not Assigned"}

</p>



<p>

Account Status:

${profile.status}

</p>


`;








document.getElementById(

"wallet"

).innerHTML = `



<p>

Lumen:

${profile.wallet.Lumen}

</p>



<p>

Aurel:

${profile.wallet.Aurel}

</p>



<p>

Virel:

${profile.wallet.Virel}

</p>



<p>

Sylem:

${profile.wallet.Sylem}

</p>



<p>

Bront:

${profile.wallet.Bront}

</p>



`;





}







function logout(){


localStorage.removeItem(

"currentUser"

);


}






loadProfile();



</script>



</body>

</html>
