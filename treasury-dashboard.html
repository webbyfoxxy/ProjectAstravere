<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Treasury Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="sidebar.css">
    <link rel="stylesheet" href="dashboard.css">
</head>
<body>
    <div class="dashboard-layout">
        <div class="sidebar">
            <div class="sidebar-logo">Treasury</div>
            <ul class="sidebar-menu">
                <li><a onclick="showSection('stats')">📊 Overview</a></li>
                <li><a onclick="showSection('transfer')">💸 Fund User</a></li>
                <li><a onclick="showSection('loans')">📜 Issue Loan</a></li>
                <li><a onclick="logout()" style="color:#b22222;">🚪 Logout</a></li>
            </ul>
        </div>

        <div class="main-content">
            <div class="header">
                <h1 id="welcomeMsg">Treasury</h1>
                <div class="user-badge badge-creator">🏦 Treasury</div>
            </div>

            <!-- OVERVIEW -->
            <div id="stats" class="card section">
                <h2 class="title">Treasury Balances</h2>
                <div class="grid" id="walletGrid"></div>
            </div>

            <!-- TRANSFER -->
            <div id="transfer" class="card section" style="display:none;">
                <h2 class="title">Transfer Funds to User</h2>
                <p class="subtitle">Use the recipient's Username.</p>
                <div class="form-group">
                    <input type="text" id="tReceiver" placeholder="Receiver Username">
                </div>
                <div class="form-group">
                    <select id="tCurrency">
                        <option value="Lumen">Lumen</option>
                        <option value="Aurel">Aurel</option>
                        <option value="Virel">Virel</option>
                        <option value="Sylem">Sylem</option>
                        <option value="Bront">Bront</option>
                    </select>
                </div>
                <div class="form-group">
                    <input type="number" id="tAmount" placeholder="Amount">
                </div>
                <button onclick="executeTransfer()">Transfer Funds</button>
            </div>

            <!-- LOANS -->
            <div id="loans" class="card section" style="display:none;">
                <h2 class="title">Issue Loan</h2>
                <p class="subtitle">Use the recipient's Username.</p>
                <div class="form-group">
                    <input type="text" id="lUser" placeholder="Receiver Username">
                </div>
                <div class="form-group">
                    <select id="lCurrency">
                        <option value="Lumen">Lumen</option>
                        <option value="Aurel">Aurel</option>
                        <option value="Virel">Virel</option>
                        <option value="Sylem">Sylem</option>
                        <option value="Bront">Bront</option>
                    </select>
                </div>
                <div class="form-group">
                    <input type="number" id="lAmount" placeholder="Loan Amount">
                </div>
                <button onclick="issueLoan()">Issue Loan</button>
                
                <div class="gold-line"></div>
                <h3 class="subtitle">Active Loans Issued</h3>
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>Loan ID</th>
                                <th>User ID</th>
                                <th>Amount</th>
                                <th>Currency</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody id="loanBody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="api.js"></script>
    <script>
        const user = currentUser();
        if (!user || user.role !== 'Treasury') window.location.href = "index.html";
        document.getElementById('welcomeMsg').innerText = `Welcome, ${user.username}`;

        function showSection(id) {
            document.querySelectorAll('.section').forEach(s => s.style.display = 'none');
            document.getElementById(id).style.display = 'block';
            if (id === 'stats') loadStats();
            if (id === 'loans') loadLoans();
        }

        async function loadStats() {
            const r = await getTreasuries();
            if (r.success) {
                const t = r.data.find(x => x.treasuryId === user.userId);
                if (t) {
                    document.getElementById('walletGrid').innerHTML = `
                        <div class="wallet-card"><div class="wallet-name">Lumen</div><div class="wallet-value">${t.Lumen}</div></div>
                        <div class="wallet-card"><div class="wallet-name">Aurel</div><div class="wallet-value">${t.Aurel}</div></div>
                        <div class="wallet-card"><div class="wallet-name">Virel</div><div class="wallet-value">${t.Virel}</div></div>
                        <div class="wallet-card"><div class="wallet-name">Sylem</div><div class="wallet-value">${t.Sylem}</div></div>
                        <div class="wallet-card"><div class="wallet-name">Bront</div><div class="wallet-value">${t.Bront}</div></div>
                    `;
                }
            }
        }

        async function executeTransfer() {
            const rUser = document.getElementById('tReceiver').value;
            const cur = document.getElementById('tCurrency').value;
            const amt = Number(document.getElementById('tAmount').value);
            
            if (!rUser || amt <= 0) { alert("Invalid data."); return; }
            
            const r = await treasuryTransfer(user.userId, rUser, cur, amt);
            alert(r.message);
            if (r.success) {
                document.getElementById('tReceiver').value = "";
                document.getElementById('tAmount').value = "";
                loadStats();
            }
        }

        async function issueLoan() {
            const rUser = document.getElementById('lUser').value;
            const cur = document.getElementById('lCurrency').value;
            const amt = Number(document.getElementById('lAmount').value);
            
            if (!rUser || amt <= 0) { alert("Invalid data."); return; }
            
            const r = await processLoan(user.userId, rUser, cur, amt);
            alert(r.message);
            if (r.success) {
                document.getElementById('lUser').value = "";
                document.getElementById('lAmount').value = "";
                loadStats();
                loadLoans();
            }
        }

        async function loadLoans() {
            const r = await getLoans();
            const b = document.getElementById('loanBody');
            if (r.success && r.data.length > 0) {
                b.innerHTML = r.data.filter(l => l.treasuryId === user.userId).map(l => `
                    <tr>
                        <td>${l.loanId}</td>
                        <td>${l.userId}</td>
                        <td>${l.amount}</td>
                        <td>${l.currency}</td>
                        <td><span class="badge ${l.status === 'Active' ? 'badge-creator' : 'badge-member'}">${l.status}</span></td>
                    </tr>
                `).join('');
            } else {
                b.innerHTML = `<tr><td colspan="5" class="empty-state">No active loans.</td></tr>`;
            }
        }

        // Initial Load
        showSection('stats');
    </script>
</body>
</html>
