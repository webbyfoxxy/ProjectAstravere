<!DOCTYPE html><html><head><title>Inventory Hub</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="sidebar.css"><link rel="stylesheet" href="dashboard.css"></head>
<body><div class="dashboard-layout"><div class="sidebar"><div class="sidebar-logo">Inventory</div><ul class="sidebar-menu"><li><a href="creator-dashboard.html">📊 Main Dashboard</a></li><li><a href="treasury.html">🏦 Treasury</a></li><li><a href="inventory.html">🎒 Inventory Hub</a></li><li><a onclick="logout()" style="color:#b22222;">🚪 Logout</a></li></ul></div>
<div class="main-content"><div class="header"><h1>Central Inventory Hub</h1><div class="user-badge badge-creator">👑 Creator</div></div>
<div class="card section inventory-panel"><div class="panel-header"><h2>Register Inventory Account</h2></div><p style="margin-bottom:15px; color:#aaa;">Requires Inventory Key.</p><div class="form-group"><input type="text" id="iName" placeholder="Account Name (e.g., Royal Armory)"></div><div class="form-group"><input type="text" id="iDesc" placeholder="Description"></div><div class="form-group"><input type="text" id="iKey" placeholder="Inventory Key"></div><div class="form-group"><input type="password" id="iPass" placeholder="Inventory Password"></div><button class="btn-success" onclick="createInvAccount()">Create Account</button></div>
<div class="card section"><h2 class="title">Active Inventory Accounts</h2><div class="table-container"><table><thead><tr><th>Account ID</th><th>Name</th><th>Description</th><th>Created</th></tr></thead><tbody id="invAccBody"></tbody></table></div></div>
<div class="card section"><h2 class="title">Distribute Items</h2><div class="action-grid"><div class="mini-form"><h3>Target Audience</h3><select id="dTargetType" onchange="toggleTargetUser()"><option value="all">Distribute to ALL Members</option><option value="specific">Distribute to Specific User</option></select><input type="text" id="dTargetUser" placeholder="Target Username" style="display:none;"></div><div class="mini-form"><h3>Item & Quantity</h3><input type="text" id="dAccId" placeholder="Your Inventory Account ID"><select id="dProdId"><option value="">Loading Items...</option></select><input type="number" id="dQty" placeholder="Quantity" value="1"></div></div><button onclick="executeDistribute()" style="margin-top:15px;">Execute Distribution</button></div>
</div></div>
<script src="api.js"></script><script>
const user=currentUser();if(!user||user.role!=='Creator')window.location.href="index.html";
function toggleTargetUser(){const v=document.getElementById('dTargetType').value;document.getElementById('dTargetUser').style.display=v==='specific'?'block':'none';}
async function createInvAccount(){const r=await registerInventoryAccount(iName.value,iDesc.value,iKey.value,iPass.value);alert(r.message);if(r.success){iName.value="";iDesc.value="";iKey.value="";iPass.value="";loadInvAccounts();}}
async function executeDistribute(){const isSpecific=document.getElementById('dTargetType').value==='specific';const targetUser=isSpecific?document.getElementById('dTargetUser').value:"";const prodId=document.getElementById('dProdId').value;if(!prodId){alert("Please select an item.");return;}const r=await distributeItem(dAccId.value,prodId,Number(dQty.value),targetUser);alert(r.message);}
async function loadInvAccounts(){const r=await getInventoryAccounts(),b=document.getElementById('invAccBody');if(r.success&&r.data.length>0){b.innerHTML=r.data.map(a=>`<tr><td>${a.inventoryAccountId}</td><td>${a.accountName}</td><td>${a.description}</td><td>${new Date(a.createdAt).toLocaleDateString()}</td></tr>`).join('');}else{b.innerHTML=`<tr><td colspan="4" class="empty-state">No inventory accounts registered.</td></tr>`;}}
async function loadProducts(){const r=await getAllProducts(),s=document.getElementById('dProdId');if(r.success&&r.data.length>0){s.innerHTML=r.data.map(p=>`<option value="${p.productId}">${p.productName} (${p.category})</option>`).join('');}else{s.innerHTML=`<option value="">No items available</option>`;}}
loadInvAccounts();loadProducts();
</script></body></html>
