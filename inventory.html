<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventory Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Lato:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="sidebar.css">
    <link rel="stylesheet" href="dashboard.css">
</head>
<body>
    <div class="dashboard-layout">
        <div class="sidebar">
            <div class="sidebar-logo">Inventory</div>
            <ul class="sidebar-menu">
                <li><a onclick="showSection('distribute')">🎒 Distribute Items</a></li>
                <li><a onclick="logout()" style="color:#b22222;">🚪 Logout</a></li>
            </ul>
            <div class="theme-switcher">
                <label>Theme</label>
                <select id="themeSelect" onchange="setTheme(this.value)">
                    <option value="dark-gold">Dark Gold</option><option value="gold-white">Royal White Gold</option><option value="blue-violet">Mystic Blue Violet</option>
                    <option value="royal-red">Royal Red</option><option value="ocean-blue">Ocean Blue</option><option value="amber-orange">Amber Orange</option>
                    <option value="mystic-pink">Mystic Pink</option><option value="emerald-green">Emerald Green</option><option value="charcoal-gray">Charcoal Gray</option>
                </select>
            </div>
        </div>
        <div class="main-content">
            <div class="header"><h1 id="welcomeMsg">Inventory</h1><div class="user-badge badge-creator">🎒 Inventory</div></div>
            <div id="distribute" class="card section"><h2 class="title">Distribute Items</h2><p class="subtitle">Send items to all members or a specific user via Username.</p><div class="action-grid"><div class="mini-form"><h3>Target Audience</h3><select id="dTargetType" onchange="toggleTargetUser()"><option value="all">Distribute to ALL Members</option><option value="specific">Distribute to Specific User</option></select><input type="text" id="dTargetUser" placeholder="Target Username" style="display:none;"></div><div class="mini-form"><h3>Item & Quantity</h3><select id="dProdId"><option value="">Loading Items...</option></select><input type="number" id="dQty" placeholder="Quantity" value="1"></div></div><button onclick="executeDistribute()" style="margin-top:15px;">Execute Distribution</button></div>
        </div>
    </div>
    <script src="api.js"></script>
    <script>
        window.onload = loadTheme;
        const user = currentUser(); if (!user || user.role !== 'Inventory') window.location.href = "index.html";
        document.getElementById('welcomeMsg').innerText = `Welcome, ${user.username}`;
        function showSection(id) { document.querySelectorAll('.section').forEach(s => s.style.display = 'none'); document.getElementById(id).style.display = 'block'; if (id === 'distribute') loadProducts(); }
        function toggleTargetUser() { const val = document.getElementById('dTargetType').value; document.getElementById('dTargetUser').style.display = val === 'specific' ? 'block' : 'none'; }
        async function executeDistribute() { const isSpecific = document.getElementById('dTargetType').value === 'specific'; const targetUser = isSpecific ? document.getElementById('dTargetUser').value : ""; const prodId = document.getElementById('dProdId').value; const qty = Number(document.getElementById('dQty').value); if (!prodId) { alert("Please select an item."); return; } const r = await distributeItem(user.userId, prodId, qty, targetUser); alert(r.message); }
        async function loadProducts() { const r = await getAllProducts(); const select = document.getElementById('dProdId'); if (r.success && r.data.length > 0) { select.innerHTML = r.data.map(p => `<option value="${p.productId}">${p.productName} (${p.category})</option>`).join(''); } else { select.innerHTML = `<option value="">No items available</option>`; } }
        showSection('distribute');
    </script>
</body>
</html>
