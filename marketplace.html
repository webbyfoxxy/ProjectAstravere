<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Marketplace - Roleplay Bank</title>

<link rel="stylesheet" href="dashboard.css">

</head>


<body>


<div class="dashboard">


<h1>
Adonia Marketplace
</h1>


<p>
Buy items from approved sellers
</p>





<div id="products">

Loading marketplace...

</div>





<button onclick="goDashboard()">

Back Dashboard

</button>




<button onclick="logout()">

Logout

</button>



<p id="message"></p>


</div>







<script src="api.js"></script>



<script>



const user =
getSession();





if(!user){


window.location.href =
"index.html";


}







async function loadMarketplace(){



const result =
await getMarketplace();





let html = "";





if(result.success){



result.data.forEach(product=>{



html += `


<div class="card">


<h3>

${product[3]}

</h3>



<p>

Seller:
${product[2]}

</p>



<p>

Category:
${product[4]}

</p>



<p>

${product[5]}

</p>



<p>

Price:
${product[6]}
Lumen

</p>



<p>

Stock:
${product[7]}

</p>




<button onclick="buy('${product[0]}')">

Buy

</button>



</div>



<hr>


`;



});



}





document.getElementById(
"products"
).innerHTML =
html || "No products available.";






}









async function buy(productId){



const result =
await buyProduct({

productId:productId,


userId:user.userId



});





document.getElementById(
"message"
).innerHTML =
result.message;




loadMarketplace();



}







function goDashboard(){



if(user.role === "Creator"){


window.location.href =
"creator-dashboard.html";


}

else if(user.role === "Seller"){


window.location.href =
"seller-dashboard.html";


}

else{


window.location.href =
"member-dashboard.html";


}



}






loadMarketplace();



</script>


</body>

</html>
