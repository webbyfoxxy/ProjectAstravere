<!DOCTYPE html>

<html lang="en">


<head>


<meta charset="UTF-8">


<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>

Luxemneaux Imperial Marketplace

</title>



<link rel="stylesheet" href="style.css">


</head>



<body>





<div class="dashboard-layout">





<!-- =====================================
     SIDEBAR
===================================== -->


<aside class="sidebar">


<div class="sidebar-logo">

Luxemneaux

</div>



<ul class="sidebar-menu">



<li>

<a href="member-dashboard.html">

🏰 Dashboard

</a>

</li>




<li>

<a href="marketplace.html">

🛒 Marketplace

</a>

</li>




<li>

<a href="#" onclick="logout()">

🚪 Logout

</a>

</li>



</ul>


</aside>








<!-- =====================================
     MAIN MARKET AREA
===================================== -->


<main class="main-content">





<header class="header">


<h1 class="imperial-title">

🛒 Imperial Marketplace

</h1>



<div class="user-badge">

🏪 Merchant District

</div>



</header>








<!-- =====================================
     SEARCH
===================================== -->


<section class="card">


<h2 class="title">

🔍 Search Marketplace

</h2>



<div class="form-group">


<input

id="searchBox"

placeholder="Search goods, merchants, items..."

>


</div>




<button

class="btn"

onclick="searchMarket()"

>

🔎 Search

</button>



</section>









<!-- =====================================
     PRODUCTS
===================================== -->


<section class="card">


<h2 class="title">

📦 Available Goods

</h2>





<div

id="productContainer"

class="grid"

>


<div class="empty-state">

Loading marketplace...

</div>



</div>




</section>
<!-- =====================================
     AUCTION SECTION
===================================== -->


<section class="card">


<h2 class="title">

⚔️ Imperial Auctions

</h2>




<div

id="auctionContainer"

class="grid"

>


<div class="empty-state">

Loading auctions...

</div>



</div>




</section>







<!-- =====================================
     PRODUCT TEMPLATE AREA
===================================== -->


<template id="productTemplate">


<div class="product-card">



<h3 class="product-name">

Product Name

</h3>




<p>

🏪 Seller:

<span class="seller-name">

Merchant

</span>

</p>





<p class="product-description">

Description

</p>





<div class="product-price">

0

</div>





<p class="stock">

📦 Stock:

<span>

0

</span>

</p>





<button

class="btn"

>

🪙 Purchase

</button>



</div>


</template>







<!-- =====================================
     AUCTION TEMPLATE
===================================== -->


<template id="auctionTemplate">


<div class="auction-card">



<h3>

Auction Item

</h3>





<p>

📜 Description

</p>





<div class="bid-value">

0

</div>





<p>

⏳ Remaining:

<span class="auction-time">

-

</span>

</p>






<input

type="number"

class="bid-input"

placeholder="Your bid amount"

>






<button

class="btn"

>

⚔️ Place Bid

</button>




</div>


</template>
<!-- =====================================
     SCRIPTS
===================================== -->


<script src="api.js"></script>



<script>


/* =====================================
   LOAD PRODUCTS
===================================== */


async function loadProducts(){



const result =

await getProducts();




const container =

document
.getElementById(
"productContainer"
);





if(
!result.success
){


container.innerHTML =

`

<div class="empty-state">

❌ Unable to load marketplace.

</div>

`;

return;


}






container.innerHTML = "";






result.data.forEach(

product=>{





container.innerHTML +=



`

<div class="product-card">



<h3>

📦 ${product.productName}

</h3>




<p>

🏪 Seller:

${product.businessName || "Unknown"}

</p>




<p>

${product.description}

</p>




<div class="product-price">

${product.price}

${product.currency}

</div>





<p class="stock">

📦 Stock:

${product.stock}

</p>





<button

class="btn"

onclick="buyProduct('${product.productId}')"

>

🪙 Purchase

</button>




</div>


`;





}

);





}








/* =====================================
   SEARCH MARKET
===================================== */


async function searchMarket(){



const keyword =

document
.getElementById(
"searchBox"
)
.value;





const result =

await searchProducts(

keyword

);





const container =

document
.getElementById(
"productContainer"
);





if(
result.success
){



container.innerHTML = "";




result.data.forEach(

product=>{



container.innerHTML +=



`

<div class="product-card">


<h3>

📦 ${product.productName}

</h3>



<p>

🏪 ${product.businessName}

</p>



<p>

${product.description}

</p>



<div class="product-price">

${product.price}

${product.currency}

</div>



<button

class="btn"

onclick="buyProduct('${product.productId}')"

>

🪙 Buy

</button>



</div>


`;



}

);



}



}








/* =====================================
   BUY PRODUCT
===================================== */


async function buyProduct(

productId

){



const result =

await purchaseProduct(

productId

);





if(
result.success
){



alert(

"✅ Purchase completed."

);



loadProducts();



}

else{



alert(

"❌ " +

result.message

);



}



}








/* =====================================
   LOAD AUCTIONS
===================================== */


async function loadAuctions(){



const result =

await getAuctions();





const container =

document
.getElementById(
"auctionContainer"
);





if(
!result.success
){



container.innerHTML =

`

<div class="empty-state">

No auctions available.

</div>

`;

return;


}





container.innerHTML = "";






result.data.forEach(

auction=>{





container.innerHTML +=



`

<div class="auction-card">



<h3>

⚔️ ${auction.itemName}

</h3>



<p>

${auction.description}

</p>





<div class="bid-value">

${auction.currentBid || auction.startingPrice}

${auction.currency}

</div>





<input

type="number"

id="bid-${auction.auctionId}"

placeholder="Enter bid"

>






<button

class="btn"

onclick="placeAuctionBid('${auction.auctionId}')"

>

⚔️ Bid

</button>




</div>


`;




}

);





}








/* =====================================
   PLACE BID
===================================== */


async function placeAuctionBid(

auctionId

){



const amount =

document
.getElementById(

"bid-" +

auctionId

)
.value;






const result =

await placeBid(

auctionId,

amount

);





if(
result.success
){



alert(

"⚔️ Bid submitted."

);



loadAuctions();



}

else{



alert(

"❌ " +

result.message

);



}



}







/* =====================================
   INITIALIZE MARKET
===================================== */


window.onload = function(){



loadProducts();


loadAuctions();



};



</script>





<footer class="footer">


<p>

⚜️ Luxemneaux Imperial Marketplace ⚜️

</p>


<p>

🛒 Trade • Purchase • Auction • Prosper

</p>


</footer>





</main>



</div>





</body>


</html>
