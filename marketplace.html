<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marketplace</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="dashboard.css">
</head>
<body>
    <div class="container" style="padding: 30px;">
        <h1 class="imperial-title">Royal Marketplace</h1>
        <div class="gold-line"></div>
        <div class="grid" id="marketGrid"></div>
    </div>
    <script src="api.js"></script>
    <script>
        async function loadMarket() {
            const res = await getProducts();
            const grid = document.getElementById('marketGrid');
            if (res.success && res.data.length > 0) {
                grid.innerHTML = res.data.map(p => `
                    <div class="product-card">
                        <h3>${p.productName}</h3>
                        <p>${p.description}</p>
                        <div class="product-price">${p.price} ${p.currency}</div>
                        <p class="stock">In Stock: ${p.stock}</p>
                        ${currentUser() ? `<button onclick="buyItem('${p.productId}')">Purchase</button>` : `<a href="index.html"><button>Login to Buy</button></a>`}
                    </div>
                `).join('');
            } else { grid.innerHTML = `<div class="empty-state">No items in marketplace.</div>`; }
        }
        async function buyItem(id) {
            if (confirm("Purchase this item?")) {
                const res = await purchaseProduct(id);
                alert(res.message);
            }
        }
        loadMarket();
    </script>
</body>
</html>
