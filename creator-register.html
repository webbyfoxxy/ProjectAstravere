<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Roleplay Bank | Creator Registration</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="auth-container">


<div class="auth-box">


<h1>
Creator Registration
</h1>


<p>
Imperial Administrator Access
</p>



<input
id="username"
type="text"
placeholder="Creator Username">



<input
id="password"
type="password"
placeholder="Password">



<input
id="roleplayName"
type="text"
placeholder="Roleplay Name">



<input
id="creatorKey"
type="password"
placeholder="Creator Key">



<button onclick="registerCreatorAccount()">

Create Creator Account

</button>



<div class="auth-links">

<a href="index.html">

Return to Login

</a>

</div>



<div id="message"></div>


</div>


</div>



<script src="api.js"></script>



<script>


async function registerCreatorAccount(){


const username =
document.getElementById("username").value;



const password =
document.getElementById("password").value;



const roleplayName =
document.getElementById("roleplayName").value;



const creatorKey =
document.getElementById("creatorKey").value;



const message =
document.getElementById("message");



message.innerHTML =
"Verifying Creator access...";



const result =
await registerCreator({


username:username,


password:password,


roleplayName:roleplayName,


creatorKey:creatorKey


});



if(!result.success){


message.innerHTML =
result.message;


return;


}



message.innerHTML =
"Creator account created.";



setTimeout(()=>{


window.location.href =
"index.html";


},1500);



}


</script>



</body>

</html>
