<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seller Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="sidebar.css">
    <link rel="stylesheet" href="dashboard.css">
</head>
<body>
    <div class="dashboard-layout">
        <div class="sidebar">
            <div class="sidebar-logo">Seller Panel</div>
            <ul class="sidebar-menu">
                <li><a onclick="showSection('add')">➕ Add Product</a></li>
                <li><a onclick="showSection('auc')">⚔️ Start Auction</a></li>
                <li><a onclick="showSection('wallet')">🪙 My Wallet</a></li>
                <li><a onclick="logout()" style="color:#b22222;">🚪 Logout</a></li>
            </ul>
        </div>

        <div class="main-content">
            <div class="header">
                <h1>Welcome, Seller</h1>
                <div class="user-badge badge-seller">🏪 Seller</div>
            </div>

            <div id="add" class="card section">
                <h2 class="title">Create Product</h2>
                <div class="form-group"><input type="text" id="pName" placeholder="Product Name"></div>
                <div class="form-group"><input type="text" id="pCat" placeholder="Category"></div>
                <div class="form-group"><textarea id="pDesc" placeholder="Description"></textarea></div>
                <div class="form-group"><input type="number" id="pPrice" placeholder="Price"></div>
                <div class="form-group">
                    <select id="pCur">
                        <option value="Lumen">Lumen</option><option value="Aurel">Aurel</option>
                        <option value="Virel">Virel</option><option value="Sylem">Sylem</option><option value="Bront">Bront</option>
                    </select>
                </div>
                <div class="form-group"><input type="number" id="pStock" placeholder="Stock"></div>
                <button onclick="createProd()">Submit Product</button>
            </div>

            <div id="auc" class="card section" style="display:none;">
                <h2 class="title">Create Auction</h2>
                <div class="form-group"><input type="text" id="aName" placeholder="Item Name"></div>
                <div class="form-group"><textarea id="aDesc" placeholder="Description"></textarea></div>
                <div class="form-group"><input type="number" id="aStart" placeholder="Starting Price"></div>
                <div class="form-group">
                    <select id="aCur">
                        <option value="Lumen">Lumen</option><option value="Aurel">Aurel</option>
                        <option value="Virel">Virel</option><option value="Sylem">Sylem</option><option value="Bront">Bront</option>
                    </select>
                </div>
                <div class="form-group"><input type="datetime-local" id="aEnd"></div>
                <button onclick="createAuc()">Submit Auction</button>
            </div>

            <div id="wallet" class="card section" style="display:none;">
                <h2 class="title">Your Wallet</h2>
                <div class="grid" id="walletGrid"></div>
            </div>
        </div>
    </div>

    <script src="api.js"></script>
    <script>
        const user = currentUser();
        if (!user || user.role === "Member") window.location.href = "index.html";

        function showSection(id) {
            document.querySelectorAll('.section').forEach(s => s.style.display = 'none');
            document.getElementById(id).style.display = 'block';
            if (id === 'wallet') loadWallet();
        }

        async function createProd() {
            const res = await createProduct({
                productName: pName.value, category: pCat.value, description: pDesc.value,
                price: Number(pPrice.value), currency: pCur.value, stock: Number(pStock.value)
            });
            alert(res.message);
        }

        async function createAuc() {
            const res = await createAuction({
                itemName: aName.value, description: aDesc.value, startingPrice: Number(aStart.value),
                currency: aCur.value, endTime: new Date(aEnd.value).toISOString()
            });
            alert(res.message);
        }

        async function loadWallet() {
            const res = await getWallet();
            if (res.success) {
                const w = res.data;
                document.getElementById('walletGrid').innerHTML = `
                    <div class="wallet-card"><div class="wallet-name">Lumen</div><div class="wallet-value">${w.Lumen}</div></div>
                    <div class="wallet-card"><div class="wallet-name">Aurel</div><div class="wallet-value">${w.Aurel}</div></div>
                    <div class="wallet-card"><div class="wallet-name">Virel</div><div class="wallet-value">${w.Virel}</div></div>
                    <div class="wallet-card"><div class="wallet-name">Sylem</div><div class="wallet-value">${w.Sylem}</div></div>
                    <div class="wallet-card"><div class="wallet-name">Bront</div><div class="wallet-value">${w.Bront}</div></div>
                `;
            }
        }
    </script>
</body>
</html>
