<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Seller Dashboard - Roleplay Bank</title>

<link rel="stylesheet" href="dashboard.css">

</head>


<body>


<div class="dashboard">


<h1>
Seller Dashboard
</h1>




<div id="profile">

Loading...

</div>





<h2>
Seller Application
</h2>


<input
id="shopName"
placeholder="Shop Name"
>


<textarea
id="shopDescription"
placeholder="Shop Description">
</textarea>



<button onclick="applyForSeller()">

Apply Seller

</button>







<h2>
Create Product
</h2>



<input
id="productName"
placeholder="Product Name"
>



<input
id="category"
placeholder="Category"
>



<textarea
id="description"
placeholder="Description">
</textarea>




<input
id="price"
type="number"
placeholder="Price"
>




<input
id="stock"
type="number"
placeholder="Stock"
>




<button onclick="submitProduct()">

Submit Product

</button>







<br><br>



<button onclick="goMarketplace()">

Marketplace

</button>




<button onclick="logout()">

Logout

</button>



<p id="message"></p>



</div>








<script src="api.js"></script>


<script>


const user =
getSession();



if(!user){


window.location.href =
"index.html";


}






async function loadSeller(){



const profile =
await getProfile(
user.userId
);




if(profile.success){



document.getElementById(
"profile"
).innerHTML = `


<h3>
${profile.data.roleplayName}
</h3>


<p>
Role:
${profile.data.role}
</p>


<p>
User ID:
${profile.data.userId}
</p>


`;



}



}









async function applyForSeller(){



const result =
await applySeller({


userId:
user.userId,


shopName:
document.getElementById(
"shopName"
).value,


description:
document.getElementById(
"shopDescription"
).value



});





document.getElementById(
"message"
).innerHTML =
result.message;



}









async function submitProduct(){



const profile =
await getProfile(
user.userId
);





const result =
await createProduct({


sellerId:
user.userId,


sellerName:
profile.data.roleplayName,


productName:
document.getElementById(
"productName"
).value,


category:
document.getElementById(
"category"
).value,


description:
document.getElementById(
"description"
).value,


price:
document.getElementById(
"price"
).value,


stock:
document.getElementById(
"stock"
).value



});





document.getElementById(
"message"
).innerHTML =
result.message;



}








function goMarketplace(){


window.location.href =
"marketplace.html";


}






loadSeller();



</script>


</body>

</html>
