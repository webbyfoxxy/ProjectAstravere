<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luxemneaux Bank</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Lato:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
    <div class="auth-box">
        <div class="auth-logo">👑</div>
        <h1 class="imperial-title">LUXEMNEAUX</h1>
        <p class="subtitle">Royal Treasury & Marketplace</p>
        <div class="gold-line"></div>
        <h2 class="title">Login</h2>
        <div class="form-group"><input type="text" id="username" placeholder="Username"></div>
        <div class="form-group"><input type="password" id="password" placeholder="Password"></div>
        <button onclick="handleLogin()">Enter the Realm</button>
        <div class="auth-footer"><a href="register.html">New here? Register an Account</a></div>
    </div>
    <script src="api.js"></script>
    <script>
        window.onload = loadTheme;
        async function handleLogin() {
            const u = document.getElementById('username').value, p = document.getElementById('password').value;
            const r = await login(u, p);
            if (r.success) redirectByRole(); else alert(r.message);
        }
    </script>
</body>
</html>
