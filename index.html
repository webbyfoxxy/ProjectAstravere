<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luxemneaux Roleplay Bank</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
    <div class="auth-box">
        <div class="auth-logo">👑</div>
        <h1 class="imperial-title">LUXEMNEAUX</h1>
        <p class="subtitle">Royal Treasury & Marketplace</p>
        <div class="gold-line"></div>
        
        <div id="authForm">
            <h2 class="title" id="formTitle">Login</h2>
            <div class="form-group"><input type="text" id="username" placeholder="Username"></div>
            <div class="form-group"><input type="password" id="password" placeholder="Password"></div>

            <div id="registerFields" style="display:none;">
                <div class="form-group"><input type="text" id="roleplayName" placeholder="Roleplay Name"></div>
                <div class="form-group"><input type="text" id="kingdomId" placeholder="Kingdom ID (Optional)"></div>
                <div class="form-group" id="creatorKeyField" style="display:none;"><input type="text" id="creatorKey" placeholder="Creator Key"></div>
            </div>

            <button onclick="handleAuth()" style="width:100%; margin-top:10px;">Enter the Realm</button>
            <div class="auth-footer">
                <a onclick="toggleForm('member')" id="toggleLink">New here? Register as Member</a><br>
                <a onclick="toggleForm('creator')" id="creatorLink" style="font-size:12px; margin-top:5px; display:none;">Have a Creator Key? Register as Creator</a>
            </div>
        </div>
    </div>

    <script src="api.js"></script>
    <script>
        let currentMode = 'login';
        function toggleForm(mode) {
            currentMode = mode;
            const regFields = document.getElementById('registerFields');
            const creatorField = document.getElementById('creatorKeyField');
            const creatorLink = document.getElementById('creatorLink');
            const title = document.getElementById('formTitle');
            const link = document.getElementById('toggleLink');

            if (mode === 'login') {
                regFields.style.display = 'none'; creatorField.style.display = 'none'; creatorLink.style.display = 'none';
                title.innerText = "Login"; link.innerText = "New here? Register as Member";
                link.setAttribute('onclick', "toggleForm('member')");
            } else if (mode === 'member') {
                regFields.style.display = 'block'; creatorField.style.display = 'none'; creatorLink.style.display = 'block';
                title.innerText = "Member Registration"; link.innerText = "Already have an account? Login";
                link.setAttribute('onclick', "toggleForm('login')");
            } else if (mode === 'creator') {
                regFields.style.display = 'block'; creatorField.style.display = 'block'; creatorLink.style.display = 'none';
                title.innerText = "Creator Registration"; link.innerText = "Already have an account? Login";
                link.setAttribute('onclick', "toggleForm('login')");
            }
        }

        async function handleAuth() {
            const u = document.getElementById('username').value;
            const p = document.getElementById('password').value;
            if (currentMode === 'login') {
                const res = await login(u, p);
                if (res.success) redirectByRole(); else alert(res.message);
            } else {
                const rp = document.getElementById('roleplayName').value;
                const k = document.getElementById('kingdomId').value || "";
                if (currentMode === 'member') {
                    const res = await register(u, p, rp, k);
                    if (res.success) { alert("Registered! Please login."); toggleForm('login'); } else alert(res.message);
                } else if (currentMode === 'creator') {
                    const key = document.getElementById('creatorKey').value;
                    const res = await registerCreator(u, p, rp, k, key);
                    if (res.success) { alert("Creator Registered! Please login."); toggleForm('login'); } else alert(res.message);
                }
            }
        }
    </script>
</body>
</html>
