<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Roleplay Bank - Login</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="login-container">


    <h1>
        Roleplay Bank
    </h1>


    <p>
        Enter the world of Adonia
    </p>



    <input
        id="username"
        type="text"
        placeholder="Username"
    >



    <input
        id="password"
        type="password"
        placeholder="Password"
    >



    <button onclick="loginAccount()">

        Login

    </button>




    <p id="message"></p>




    <a href="register.html">

        Create Account

    </a>


</div>





<script src="api.js"></script>


<script>


async function loginAccount(){



    const username =
    document.getElementById(
        "username"
    ).value;



    const password =
    document.getElementById(
        "password"
    ).value;





    const result =
    await login(
        username,
        password
    );





    const message =
    document.getElementById(
        "message"
    );




    if(result.success){



        saveSession(
            result.data
        );





        if(result.data.role === "Creator"){


            window.location.href =
            "creator-dashboard.html";


        }


        else if(result.data.role === "Seller"){


            window.location.href =
            "seller-dashboard.html";


        }


        else{


            window.location.href =
            "member-dashboard.html";


        }



    }

    else{


        message.innerHTML =
        result.message;


    }



}


</script>


</body>

</html>
