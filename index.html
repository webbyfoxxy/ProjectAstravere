<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>
Luxemneaux Empire Bank
</title>


<link rel="stylesheet" href="style.css">


</head>



<body class="magic-background">



<div class="auth-page">



<div class="auth-box imperial-card">



<div class="auth-logo">

👑🏰

</div>




<h1 class="auth-title">

Luxemneaux Empire Bank

</h1>




<p class="subtitle">

⚜️ Imperial Banking System ⚜️

</p>




<div class="gold-line"></div>





<div class="form-group">


<label>

Username

</label>


<input

type="text"

id="username"

placeholder="Enter username"

>


</div>





<div class="form-group">


<label>

Password

</label>


<input

type="password"

id="password"

placeholder="Enter password"

>


</div>





<button

onclick="loginAccount()"

class="btn"

>

🔐 Enter Kingdom

</button>





<div id="message"></div>





<div class="gold-line"></div>





<div class="auth-footer">


<p>

New citizen?

</p>



<a href="register.html">

📜 Create Account

</a>



</div>





</div>


</div>





<!-- LOADING -->

<div id="loading"

class="loading"

style="display:none;">


<div class="loading-icon">

⚜️

</div>


</div>





<script src="api.js"></script>



<script>


/* =====================================
   LOGIN FUNCTION
===================================== */


async function loginAccount(){



const username =

document
.getElementById(
"username"
)
.value;



const password =

document
.getElementById(
"password"
)
.value;



const message =

document
.getElementById(
"message"
);





if(
!username ||
!password
){



message.innerHTML =

`

<div class="alert alert-error">

⚠️ Enter username and password.

</div>

`;

return;


}





message.innerHTML =

`

<div class="alert">

⏳ Checking Imperial Records...

</div>

`;





const result =

await login(

username,

password

);





if(
result.success
){



message.innerHTML =

`

<div class="alert alert-success">

✅ Welcome to Luxemneaux Empire.

</div>

`;



setTimeout(

()=>{


redirectByRole();



},

1000

);



}

else{



message.innerHTML =

`

<div class="alert alert-error">

❌ ${result.message}

</div>

`;



}



}






/* =====================================
   ENTER KEY LOGIN
===================================== */


document.addEventListener(

"keypress",

function(e){



if(
e.key === "Enter"
){


loginAccount();


}



}


);







/* =====================================
   AUTO SESSION CHECK
===================================== */


window.onload = function(){



const user =

currentUser();



if(user){



const loading =

document
.getElementById(
"loading"
);



loading.style.display =
"flex";



setTimeout(

()=>{


redirectByRole();


},

800

);



}



};





</script>






<footer class="footer">


<p>

⚜️ Luxemneaux Empire Banking System ⚜️

</p>


<p>

🪙 Managing Lumen • Aurel • Virel • Sylem • Bront

</p>


</footer>





</body>


</html>
