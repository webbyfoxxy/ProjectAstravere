<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Luxemneaux Roleplay Bank</title>

<link rel="stylesheet"
href="style.css">

</head>

<body>

<div class="form-container">

<div class="card">

<div class="logo">

🏛️

<h1>Luxemneaux Roleplay Bank</h1>

<p>
Imperial Banking System
</p>

</div>

<form id="loginForm">

<div class="form-group">

<label>Username</label>

<input
type="text"
id="username"
required>

</div>

<div class="form-group">

<label>Password</label>

<input
type="password"
id="password"
required>

</div>

<button
type="submit">

Login

</button>

</form>

<br>

<p>

Don't have an account?

<a href="register.html">

Register Here

</a>

</p>

</div>

</div>

<script src="api.js"></script>

<script>

document
.getElementById("loginForm")
.addEventListener(
"submit",
async function(e){

e.preventDefault();

const result =
await loginUser({

username:
username.value,

password:
password.value

});

if(!result.success){

alert(result.message);

return;

}

localStorage.setItem(

"CURRENT_USER",

JSON.stringify(
result.data
)

);

switch(result.data.role){

case "Creator":

window.location=
"creator-dashboard.html";

break;

case "Seller":

window.location=
"seller-dashboard.html";

break;

default:

window.location=
"member-dashboard.html";

}

});

</script>

</body>

</html>
