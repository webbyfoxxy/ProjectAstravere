<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Member Dashboard - Roleplay Bank</title>

<link rel="stylesheet" href="dashboard.css">

</head>


<body>


<div class="dashboard">


<h1>
Member Dashboard
</h1>



<div id="profile">


Loading profile...


</div>





<h2>
Wallet
</h2>


<div id="wallet">


Loading...


</div>






<h2>
Inventory
</h2>


<div id="inventory">


Loading...


</div>






<h2>
Transfer Currency
</h2>



<input
id="receiverId"
placeholder="Receiver ID"
>



<select id="currency">


<option>
Lumen
</option>


<option>
Aurel
</option>


<option>
Virel
</option>


<option>
Sylem
</option>


<option>
Bront
</option>


</select>




<input
id="amount"
type="number"
placeholder="Amount"
>




<button onclick="sendMoney()">

Send

</button>





<br><br>



<button onclick="openMarketplace()">

Marketplace

</button>




<button onclick="openAuction()">

Auctions

</button>





<button onclick="logout()">

Logout

</button>



<p id="message"></p>



</div>








<script src="api.js"></script>



<script>



const user =
getSession();



if(!user){


window.location.href =
"index.html";


}







async function loadDashboard(){



const profile =
await getProfile(
user.userId
);





if(profile.success){



document.getElementById(
"profile"
).innerHTML = `


<h3>
${profile.data.roleplayName}
</h3>


<p>
Username:
${profile.data.username}
</p>


<p>
Role:
${profile.data.role}
</p>


<p>
Kingdom:
${profile.data.kingdom || "None"}
</p>


`;





document.getElementById(
"wallet"
).innerHTML = `


<p>Lumen:
${profile.data.wallet.Lumen}
</p>


<p>Aurel:
${profile.data.wallet.Aurel}
</p>


<p>Virel:
${profile.data.wallet.Virel}
</p>


<p>Sylem:
${profile.data.wallet.Sylem}
</p>


<p>Bront:
${profile.data.wallet.Bront}
</p>


`;



}






const items =
await loadInventory(
user.userId
);





if(items.success){



let html="";



items.data.forEach(item=>{


html += `

<p>
${item.itemName}
-
Quantity:
${item.quantity}
</p>


`;


});



document.getElementById(
"inventory"
).innerHTML =
html || "Empty";


}



}








async function sendMoney(){



const result =
await transferMoney({


senderId:
user.userId,


receiverId:
document.getElementById(
"receiverId"
).value,


currency:
document.getElementById(
"currency"
).value,


amount:
document.getElementById(
"amount"
).value



});





document.getElementById(
"message"
).innerHTML =
result.message;




loadDashboard();


}








function openMarketplace(){


window.location.href =
"marketplace.html";


}




function openAuction(){


window.location.href =
"auction.html";


}






loadDashboard();



</script>


</body>

</html>
