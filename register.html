<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
    <div class="auth-box">
        <div class="auth-logo">⚔️</div>
        <h1 class="auth-title">Member Registration</h1>
        <div class="form-group"><input type="text" id="username" placeholder="Username"></div>
        <div class="form-group"><input type="password" id="password" placeholder="Password"></div>
        <div class="form-group"><input type="text" id="roleplayName" placeholder="Roleplay Name"></div>
        <div class="form-group"><input type="text" id="kingdomId" placeholder="Kingdom ID (Optional)"></div>
        <button onclick="registerUser()" style="width:100%;">Register</button>
        <div class="auth-footer"><a href="index.html">Already have an account? Login</a></div>
    </div>
    <script src="api.js"></script>
    <script>
        async function registerUser() {
            const u = document.getElementById('username').value;
            const p = document.getElementById('password').value;
            const rp = document.getElementById('roleplayName').value;
            const k = document.getElementById('kingdomId').value;
            const res = await register(u, p, rp, k);
            if (res.success) { alert("Success! Please login."); window.location.href = "index.html"; }
            else alert(res.message);
        }
    </script>
</body>
</html>
