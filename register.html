<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Register | Luxemneaux Roleplay Bank</title>

<link rel="stylesheet"
href="style.css">

</head>

<body>

<div class="form-container">

<div class="card">

<div class="logo">

🏛️

<h1>Create Account</h1>

<p>Luxemneaux Imperial Banking</p>

</div>

<form id="registerForm">

<div class="form-group">

<label>Username</label>

<input
type="text"
id="username"
required>

</div>

<div class="form-group">

<label>Password</label>

<input
type="password"
id="password"
required>

</div>

<div class="form-group">

<label>Roleplay Name</label>

<input
type="text"
id="roleplayName"
required>

</div>

<div class="form-group">

<label>Kingdom</label>

<select id="kingdom">

<option value="None">
None
</option>

</select>

</div>

<div class="form-group">

<label>

<input
type="checkbox"
id="creatorMode">

Register as Creator

</label>

</div>

<div
class="form-group"
id="creatorKeyGroup"
style="display:none;">

<label>Creator Key</label>

<input
type="password"
id="creatorKey">

</div>

<button type="submit">

Create Account

</button>

</form>

<br>

<p>

Already have an account?

<a href="index.html">

Login

</a>

</p>

</div>

</div>

<script src="api.js"></script>

<script>

const creatorMode =
document.getElementById(
"creatorMode"
);

const creatorKeyGroup =
document.getElementById(
"creatorKeyGroup"
);

creatorMode.addEventListener(
"change",
function(){

creatorKeyGroup.style.display =
this.checked
?
"block"
:
"none";

});

async function loadKingdoms(){

    try{

        const result =
        await api(
            "getKingdoms"
        );

        if(
            result.success
            &&
            result.data
        ){

            const select =
            document.getElementById(
                "kingdom"
            );

            select.innerHTML =
            '<option value="None">None</option>';

            result.data.forEach(
            kingdom=>{

                const option =
                document.createElement(
                    "option"
                );

                option.value =
                kingdom.kingdomName;

                option.textContent =
                kingdom.kingdomName;

                select.appendChild(
                    option
                );

            });

        }

    }

    catch(e){

        console.error(e);

    }

}

loadKingdoms();

document
.getElementById(
"registerForm"
)
.addEventListener(
"submit",
async function(e){

e.preventDefault();

const data={

username:
username.value.trim(),

password:
password.value,

roleplayName:
roleplayName.value.trim(),

kingdom:
kingdom.value

};

let result;

if(
creatorMode.checked
){

result =
await registerCreator({

...data,

creatorKey:
creatorKey.value

});

}
else{

result =
await registerMember(
data
);

}

alert(
result.message
);

if(
result.success
){

window.location =
"index.html";

}

});

</script>

</body>

</html>
