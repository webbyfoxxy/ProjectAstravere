<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Roleplay Bank - Register</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="login-container">


<h1>
Create Account
</h1>


<p>
Join the Roleplay Bank
</p>





<input
id="roleplayName"
type="text"
placeholder="Character Name"
>




<input
id="username"
type="text"
placeholder="Username"
>




<input
id="password"
type="password"
placeholder="Password"
>




<select id="accountType">


<option value="Member">
Member
</option>


<option value="Creator">
Creator
</option>


</select>





<div id="creatorBox" style="display:none;">


<input
id="creatorKey"
type="password"
placeholder="Creator Key"
>


</div>





<button onclick="registerAccount()">

Register

</button>





<p id="message"></p>




<a href="index.html">

Back to Login

</a>


</div>







<script src="api.js"></script>


<script>



document
.getElementById("accountType")
.addEventListener(
"change",
function(){


    const box =
    document.getElementById(
        "creatorBox"
    );


    if(this.value === "Creator"){


        box.style.display =
        "block";


    }

    else{


        box.style.display =
        "none";


    }


});








async function registerAccount(){



    const role =
    document.getElementById(
        "accountType"
    ).value;



    const data = {


        roleplayName:
        document.getElementById(
            "roleplayName"
        ).value,


        username:
        document.getElementById(
            "username"
        ).value,


        password:
        document.getElementById(
            "password"
        ).value


    };






    let result;





    if(role === "Creator"){



        data.creatorKey =
        document.getElementById(
            "creatorKey"
        ).value;



        result =
        await creatorRegister(
            data
        );


    }

    else{


        result =
        await register(

            data.username,

            data.password,

            data.roleplayName

        );


    }







    document.getElementById(
        "message"
    ).innerHTML =
    result.message;





}



</script>


</body>

</html>
