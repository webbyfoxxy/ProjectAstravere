<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
Luxemneaux Empire Registration
</title>

<link rel="stylesheet" href="style.css">

</head>


<body class="magic-background">



<div class="auth-page">


<div class="auth-box imperial-card">



<div class="auth-logo">

👑📜

</div>



<h1 class="auth-title">

Join Luxemneaux Empire

</h1>



<p class="subtitle">

Create your identity in Luxemneaux Empire

</p>



<div class="gold-line"></div>




<div class="form-group">

<label>

Username

</label>


<input

id="username"

type="text"

placeholder="Create username"

>


</div>





<div class="form-group">


<label>

Password

</label>


<input

id="password"

type="password"

placeholder="Create password"

>


</div>





<div class="form-group">


<label>

Role

</label>



<select

id="role"

onchange="toggleCreatorKey()">


<option value="Member">

🧑 Member

</option>



<option value="Creator">

👑 Creator

</option>



</select>


</div>







<div class="form-group">


<label>

Roleplay Name

</label>


<input

id="roleplayName"

type="text"

placeholder="Enter your roleplay name"

>


</div>







<div class="form-group">


<label>

Kingdom

</label>


<select id="kingdom">


<option value="">

No Kingdom / Select Later

</option>


</select>


</div>







<div

id="creatorKeyBox"

style="display:none;"

class="form-group">


<label>

🔑 Creator Private Key

</label>



<input

id="creatorKey"

type="password"

placeholder="Enter creator key"

>


</div>







<button

class="btn"

onclick="registerAccount()"

>

📜 Create Identity

</button>






<div id="message"></div>






<div class="auth-footer">


Already registered?


<a href="index.html">

Return Login

</a>


</div>




</div>


</div>







<script src="api.js"></script>


<script>


/* =====================================
   LOAD KINGDOMS
===================================== */


async function loadKingdoms(){


const result =

await getKingdoms();




const select =

document.getElementById(
"kingdom"
);



if(result.success){


select.innerHTML =


`

<option value="">

No Kingdom / Select Later

</option>

`;



result.data.forEach(

kingdom=>{


select.innerHTML +=


`

<option value="${kingdom.kingdomId}">

${kingdom.kingdomName}

</option>

`;


}

);


}


}







/* =====================================
   CREATOR KEY DISPLAY
===================================== */


function toggleCreatorKey(){



const role =

document
.getElementById("role")
.value;



const box =

document
.getElementById("creatorKeyBox");





if(role === "Creator"){


box.style.display =
"block";


}

else{


box.style.display =
"none";


}


}








/* =====================================
   REGISTER ACCOUNT
===================================== */


async function registerAccount(){



const username =

document
.getElementById("username")
.value;



const password =

document
.getElementById("password")
.value;



const role =

document
.getElementById("role")
.value;



const roleplayName =

document
.getElementById("roleplayName")
.value;



const kingdomId =

document
.getElementById("kingdom")
.value;



const creatorKey =

document
.getElementById("creatorKey")
.value;



const message =

document
.getElementById("message");






if(

!username ||

!password ||

!roleplayName

){


message.innerHTML =


`

<div class="alert alert-error">

⚠️ Complete required fields.

</div>

`;


return;


}








if(role === "Creator" && !creatorKey){


message.innerHTML =


`

<div class="alert alert-error">

🔑 Creator Private Key required.

</div>

`;


return;


}








message.innerHTML =


`

<div class="alert">

⏳ Creating Imperial Records...

</div>

`;







let result;







if(role === "Creator"){


result =

await registerCreator(

username,

password,

roleplayName,

kingdomId,

creatorKey

);


}

else{


result =

await register(

username,

password,

roleplayName,

kingdomId

);


}








if(result.success){


message.innerHTML =


`

<div class="alert alert-success">

✅ Identity created successfully.

</div>

`;



setTimeout(()=>{


window.location.href =

"index.html";


},1200);



}

else{


message.innerHTML =


`

<div class="alert alert-error">

❌ ${result.message}

</div>

`;


}


}








/* =====================================
   LOAD PAGE
===================================== */


window.onload = function(){


loadKingdoms();


};




</script>







<footer class="footer">


<p>

⚜️ Welcome to Luxemneaux Empire ⚜️

</p>



<p>

👑 Rise from Citizen to Noble

</p>



</footer>




</body>

</html>
