<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Creator Dashboard - Roleplay Bank</title>

<link rel="stylesheet" href="dashboard.css">

</head>


<body>


<div class="dashboard">


<h1>
Creator Dashboard
</h1>




<div id="profile">

Loading...

</div>





<h2>
Users
</h2>


<button onclick="loadUsers()">

Refresh Users

</button>


<div id="users">

</div>







<h2>
Create Kingdom
</h2>


<input
id="kingdomName"
placeholder="Kingdom Name"
>


<textarea
id="kingdomDescription"
placeholder="Description">
</textarea>


<button onclick="createNewKingdom()">

Create Kingdom

</button>







<h2>
Announcement
</h2>


<input
id="announcementTitle"
placeholder="Title"
>


<textarea
id="announcementMessage"
placeholder="Message">
</textarea>


<button onclick="postAnnouncement()">

Post Announcement

</button>








<h2>
Seller Applications
</h2>


<button onclick="loadSellerApplications()">

Refresh Applications

</button>


<div id="sellerApplications">

</div>







<h2>
Products Pending Approval
</h2>


<button onclick="loadProducts()">

Refresh Products

</button>


<div id="products">

</div>







<h2>
Auctions Pending Approval
</h2>


<button onclick="loadAuctionList()">

Refresh Auctions

</button>


<div id="auctions">

</div>








<button onclick="logout()">

Logout

</button>



<p id="message"></p>



</div>







<script src="api.js"></script>


<script>


const user =
getSession();




if(!user){


window.location.href =
"index.html";


}






async function loadCreator(){



const result =
await getProfile(
user.userId
);



if(result.success){



document.getElementById(
"profile"
).innerHTML = `


<h3>
${result.data.roleplayName}
</h3>


<p>
Role:
${result.data.role}
</p>


<p>
Creator ID:
${result.data.userId}
</p>


`;



}



}









async function loadUsers(){



const result =
await getUsers();




let html = "";





result.data.slice(1)
.forEach(row=>{


html += `


<p>

ID:
${row[0]}

<br>

Name:
${row[3]}

<br>

Role:
${row[4]}

<br>

Status:
${row[6]}


<button onclick="suspend('${row[0]}')">

Suspend

</button>


</p>


<hr>


`;



});





document.getElementById(
"users"
).innerHTML =
html;


}








async function suspend(id){



const result =
await apiRequest(

"suspendUser",

{

userId:id

}

);




document.getElementById(
"message"
).innerHTML =
result.message;



loadUsers();



}









async function createNewKingdom(){



const result =
await createKingdom({


name:
document.getElementById(
"kingdomName"
).value,


description:
document.getElementById(
"kingdomDescription"
).value,


creatorId:
user.userId



});



document.getElementById(
"message"
).innerHTML =
result.message;



}








async function postAnnouncement(){



const result =
await announce({


title:
document.getElementById(
"announcementTitle"
).value,


message:
document.getElementById(
"announcementMessage"
).value,


creatorId:
user.userId



});



document.getElementById(
"message"
).innerHTML =
result.message;



}









async function loadSellerApplications(){



const result =
await apiRequest(
"getSellerApplications"
);



let html = "";




result.data.slice(1)
.forEach(row=>{


html += `


<p>

Shop:
${row[2]}


<br>

Owner:
${row[1]}


<br>


Status:
${row[4]}



<button onclick="approveSellerApp('${row[0]}')">

Approve

</button>


</p>


<hr>


`;



});




document.getElementById(
"sellerApplications"
).innerHTML =
html;



}








async function approveSellerApp(id){



const result =
await apiRequest(

"approveSeller",

{

applicationId:id

}

);



document.getElementById(
"message"
).innerHTML =
result.message;



loadSellerApplications();



}









async function loadProducts(){



const result =
await apiRequest(
"getMarketplace"
);




let html="";




if(result.data){



result.data.forEach(item=>{


html += `


<p>

${item[3]}


<br>

Seller:
${item[2]}


</p>


`;



});


}



document.getElementById(
"products"
).innerHTML =
html;



}









async function loadAuctionList(){



const result =
await getAuctions();



let html="";



result.data.forEach(item=>{


html += `


<p>

${item[3]}


<br>

Owner:
${item[2]}


</p>


`;



});




document.getElementById(
"auctions"
).innerHTML =
html;


}







loadCreator();


</script>


</body>

</html>
