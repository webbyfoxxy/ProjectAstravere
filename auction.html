<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Auction - Roleplay Bank</title>

<link rel="stylesheet" href="dashboard.css">

</head>


<body>


<div class="dashboard">


<h1>
Adonia Auction Hall
</h1>


<p>
Bid on rare items from other members
</p>





<div id="auctions">

Loading auctions...

</div>





<button onclick="goDashboard()">

Back Dashboard

</button>




<button onclick="logout()">

Logout

</button>




<p id="message"></p>



</div>







<script src="api.js"></script>



<script>


const user =
getSession();




if(!user){


window.location.href =
"index.html";


}








async function loadAuctions(){



const result =
await getAuctions();




let html = "";





if(result.success){



result.data.forEach(item=>{



html += `


<div class="card">


<h3>

${item[3]}

</h3>



<p>

Owner:
${item[2]}

</p>



<p>

Category:
${item[4]}

</p>



<p>

Description:
${item[5]}

</p>



<p>

Starting Price:
${item[6]}
Lumen

</p>



<p>

Current Bid:
${item[7]}
Lumen

</p>



<p>

Highest Bidder:
${item[8] || "None"}

</p>




<input

id="bid-${item[0]}"

type="number"

placeholder="Enter bid amount"

>



<button onclick="placeBid('${item[0]}')">

Bid

</button>



</div>


<hr>


`;



});



}





document.getElementById(
"auctions"
).innerHTML =
html || "No auctions available.";



}









async function placeBid(auctionId){



const amount =
document.getElementById(
"bid-" + auctionId
).value;






const result =
await bidAuction({



auctionId:auctionId,


userId:user.userId,


amount:amount



});





document.getElementById(
"message"
).innerHTML =
result.message;





loadAuctions();



}









function goDashboard(){



if(user.role === "Creator"){


window.location.href =
"creator-dashboard.html";


}

else if(user.role === "Seller"){


window.location.href =
"seller-dashboard.html";


}

else{


window.location.href =
"member-dashboard.html";


}



}






loadAuctions();



</script>


</body>

</html>
